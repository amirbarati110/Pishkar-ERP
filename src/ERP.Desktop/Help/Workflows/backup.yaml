page: backup
title_fa: پشتیبان‌گیری و سلامت سیستم
steps:
  - control: system-health
    instruction_fa: بالای صفحه وضعیت دیتابیس و به‌روز بودن migration ها را ببین.
    action: focus
  - control: create-backup-button
    instruction_fa: «گرفتن نسخه پشتیبان» را بزن تا یک فایل پشتیبان تازه ساخته شود.
    action: invoke
  - control: verify-backup-button
    instruction_fa: بعد از گرفتن نسخه پشتیبان، «بررسی اعتبار» را بزن — این دکمه واقعاً نسخه پشتیبان را بازیابی و بررسی می‌کند، نه فقط چک کردن وجود فایل.
    action: invoke
  - control: restore-backup
    instruction_fa: برای برگرداندن اطلاعات، «بازیابی آخرین نسخه» یا «بازیابی از فایل…» (مثلاً فایلی که روی فلش آورده‌اید) را بزنید. اول توضیح می‌دهد چه می‌شود، بعد نام کاربری و رمز مدیر را می‌خواهد. قبل از جایگزینی، خودکار از اطلاعات فعلی یک نسخه‌ی ایمنی گرفته می‌شود تا اگر اشتباه شد بشود با همین دکمه برگرداند. بعد از بازیابی برنامه را ببندید و دوباره باز کنید.
    action: invoke
