page: stock-card
title_fa: کاردکس کالا
steps:
  - control: stock-card-rows
    instruction_fa: هر ردیف یک حرکت انبار است: موجودی اول دوره، فروش، مرجوعی و…؛ ستون «سند» شماره‌ی فاکتور یا مرجوعی را نشان می‌دهد و «مانده» موجودی بعد از همان حرکت است.
    action: focus
  - control: stock-card-period
    instruction_fa: با «امروز»، «۷ روز اخیر» و «۳۰ روز اخیر» فقط حرکت‌های همان بازه را ببینید؛ «مانده‌ی قبل از بازه» همیشه موجودی درست را نگه می‌دارد.
    action: invoke
  - control: stock-card-closing
    instruction_fa: «موجودی پایان بازه» باید با ستون موجودی در لیست کالاها یکی باشد. مانده‌ی نارنجی یعنی کالا بیشتر از موجودی فروخته شده و رسیدش باید ثبت شود.
    action: focus
